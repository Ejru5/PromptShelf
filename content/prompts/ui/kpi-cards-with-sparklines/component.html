<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI cards</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b1020; color: #e5e7eb; padding: 40px 24px; min-height: 100vh; }
  .head { max-width: 1080px; margin: 0 auto 22px; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; letter-spacing: -0.02em; color: #fff; }
  .sub { font-size: 13px; color: #8b93a7; margin-top: 4px; }
  .seg { display: inline-flex; background: #141a2e; border: 1px solid #1f2742; border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: #8b93a7; font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: #222b48; color: #fff; }
  .grid { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .card { background: linear-gradient(180deg, #141a2e, #11172a); border: 1px solid #1f2742; border-radius: 18px; padding: 18px; position: relative; overflow: hidden; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: #33406b; transform: translateY(-2px); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #8b93a7; }
  .delta { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .up { color: #34d399; background: rgba(52,211,153,.12); }
  .down { color: #f87171; background: rgba(248,113,113,.12); }
  .val { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: #fff; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .cmp { font-size: 12px; color: #6b7390; margin-top: 2px; }
  svg { display: block; width: 100%; height: 56px; margin-top: 14px; overflow: visible; }
  .line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .line { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<div class="head">
  <div><h1>Overview</h1><p class="sub">Last updated 2 minutes ago</p></div>
  <div class="seg" role="group" aria-label="Range"><button>7d</button><button class="on">30d</button><button>90d</button></div>
</div>
<div class="grid" id="grid"></div>
<script>
  const cards = [
    { k: 'Revenue', v: '$84,320', d: '+12.4%', up: true, c: '#818cf8', data: [12, 14, 13, 17, 16, 19, 21, 20, 24, 26, 25, 29] },
    { k: 'Active users', v: '12,904', d: '+8.1%', up: true, c: '#34d399', data: [30, 31, 29, 33, 35, 34, 37, 39, 38, 41, 43, 44] },
    { k: 'Conversion', v: '3.82%', d: '+0.6 pts', up: true, c: '#fbbf24', data: [3.1, 3.0, 3.3, 3.2, 3.4, 3.3, 3.5, 3.6, 3.5, 3.7, 3.8, 3.82] },
    { k: 'Churn', v: '2.1%', d: '+0.3 pts', up: false, c: '#f87171', data: [1.6, 1.7, 1.7, 1.8, 1.8, 1.9, 1.8, 2.0, 2.0, 2.1, 2.0, 2.1] },
  ];
  function spark(data, color, id) {
    const w = 240, h = 56, min = Math.min(...data), max = Math.max(...data);
    const pts = data.map((v, i) => [i * w / (data.length - 1), h - 4 - (v - min) / (max - min || 1) * (h - 8)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const last = pts[pts.length - 1];
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + d + ' L' + w + ' ' + h + ' L0 ' + h + 'Z" fill="url(#g' + id + ')"/><path class="line" d="' + d + '" stroke="' + color + '"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="' + color + '"/></svg>';
  }
  document.getElementById('grid').innerHTML = cards.map((c, i) =>
    '<article class="card"><div class="top"><span>' + c.k + '</span><span class="delta ' + (c.up ? 'up' : 'down') + '">' + (c.up ? '▲ ' : '▲ ') + c.d + '</span></div>' +
    '<p class="val">' + c.v + '</p><p class="cmp">vs. previous 30 days</p>' + spark(c.data, c.c, i) + '</article>').join('');
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b)); }));
</script>
</body>
</html>
