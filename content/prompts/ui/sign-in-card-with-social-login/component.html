<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827;
    background: radial-gradient(60% 60% at 20% 20%, #fde68a 0%, transparent 60%), radial-gradient(50% 50% at 85% 30%, #fbcfe8 0%, transparent 60%), radial-gradient(60% 60% at 60% 90%, #bfdbfe 0%, transparent 60%), #fafaf9; }
  .card { width: 100%; max-width: 400px; background: rgba(255,255,255,.82); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.9); border-radius: 24px; padding: 32px; box-shadow: 0 30px 60px -30px rgba(17,24,39,.35); }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: #111827; display: grid; place-items: center; color: #fff; font-weight: 800; }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin-top: 18px; }
  .sub { color: #6b7280; font-size: 14px; margin-top: 6px; }
  .social { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
  .social button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border-radius: 12px; border: 1px solid #e5e7eb; background: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s; }
  .social button:hover { border-color: #d1d5db; box-shadow: 0 4px 12px -6px rgba(0,0,0,.2); }
  .or { display: flex; align-items: center; gap: 12px; color: #9ca3af; font-size: 12px; margin: 22px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field { position: relative; margin-bottom: 14px; }
  input[type=email], input[type=password], input[type=text] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #e5e7eb; background: #fff; font: inherit; font-size: 14px; outline: none; transition: .15s; }
  input:focus { border-color: #111827; box-shadow: 0 0 0 4px rgba(17,24,39,.08); }
  .eye { position: absolute; right: 8px; bottom: 7px; border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; color: #6b7280; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 4px 0 20px; }
  .row a { color: #111827; font-weight: 600; text-decoration: none; }
  .check { display: flex; align-items: center; gap: 8px; color: #4b5563; }
  .primary { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #111827; color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; transition: .15s; }
  .primary:hover { background: #1f2937; }
  .primary:active { transform: scale(.99); }
  .foot { text-align: center; font-size: 13px; color: #6b7280; margin-top: 20px; }
  .foot a { color: #111827; font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">A</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue to Acme.</p>
  <div class="social">
    <button type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google</button>
    <button type="button"><svg width="16" height="18" viewBox="0 0 384 512"><path fill="#111" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>Apple</button>
  </div>
  <div class="or">or continue with email</div>
  <form onsubmit="event.preventDefault(); this.querySelector('.primary').textContent='Signing in…'">
    <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" class="eye" aria-label="Show password" onclick="const i=document.getElementById('pw'); const show=i.type==='password'; i.type=show?'text':'password'; this.setAttribute('aria-label', show?'Hide password':'Show password')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <div class="row"><label class="check" style="margin:0;font-weight:500"><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p class="foot">New to Acme? <a href="#">Create an account</a></p>
</main>
</body>
</html>
