<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File upload</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f0fdf4; color: #052e16; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .panel { width: 100%; max-width: 520px; background: #fff; border-radius: 22px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 24px 48px -24px rgba(5,46,22,.25); }
  h1 { font-size: 18px; letter-spacing: -0.01em; }
  .sub { font-size: 13px; color: #4b5563; margin-top: 4px; }
  .drop { margin-top: 18px; border: 2px dashed #bbf7d0; border-radius: 16px; padding: 30px 20px; text-align: center; background: #f7fef9; cursor: pointer; transition: .2s; }
  .drop:hover, .drop.over { border-color: #16a34a; background: #ecfdf3; transform: scale(1.01); }
  .drop .ic { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 14px; background: #dcfce7; display: grid; place-items: center; }
  .drop b { color: #15803d; }
  .drop p { font-size: 14px; }
  .drop small { display: block; margin-top: 6px; color: #6b7280; font-size: 12px; }
  ul { list-style: none; padding: 0; margin-top: 16px; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 14px; }
  .thumb { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; }
  .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11.5px; color: #6b7280; margin-top: 2px; }
  .bar { height: 6px; border-radius: 6px; background: #f3f4f6; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #16a34a); border-radius: 6px; transition: width .3s; }
  .x { border: 0; background: none; color: #9ca3af; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 16px; }
  .x:hover { background: #f3f4f6; color: #111827; }
  .done { color: #16a34a; font-weight: 700; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn { border: 1px solid #e5e7eb; background: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px; cursor: pointer; }
  .btn.primary { background: #15803d; border-color: #15803d; color: #fff; }
</style>
</head>
<body>
<div class="panel">
  <h1>Upload files</h1>
  <p class="sub">Attach brand assets for your project. Max 25 MB each.</p>
  <label class="drop" id="drop">
    <input type="file" multiple hidden id="file">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></div>
    <p><b>Click to upload</b> or drag and drop</p>
    <small>PNG, JPG, PDF or SVG</small>
  </label>
  <ul id="list"></ul>
  <div class="actions"><button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Attach files</button></div>
</div>
<script>
  const colors = { PDF: '#ef4444', PNG: '#3b82f6', JPG: '#f59e0b', SVG: '#8b5cf6' };
  const list = document.getElementById('list');
  function add(name, size) {
    const ext = (name.split('.').pop() || 'FILE').toUpperCase().slice(0, 3);
    const li = document.createElement('li');
    li.innerHTML = '<span class="thumb" style="background:' + (colors[ext] || '#64748b') + '">' + ext + '</span><div style="min-width:0"><p class="name"></p><p class="meta"><span class="pct">0%</span> · ' + size + '</p><div class="bar"><i></i></div></div><button class="x" aria-label="Remove">✕</button>';
    li.querySelector('.name').textContent = name;
    li.querySelector('.x').onclick = () => li.remove();
    list.appendChild(li);
    let p = 0;
    const tick = setInterval(() => {
      p = Math.min(100, p + 6 + Math.random() * 14);
      li.querySelector('.bar i').style.width = p + '%';
      li.querySelector('.pct').textContent = p >= 100 ? 'Uploaded' : Math.round(p) + '%';
      if (p >= 100) { clearInterval(tick); li.querySelector('.pct').className = 'done'; }
    }, 280);
  }
  [['brand-guidelines.pdf', '4.2 MB'], ['hero-photo.jpg', '2.8 MB'], ['logo-mark.svg', '18 KB']].forEach(([n, s]) => add(n, s));
  const drop = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (ev) => [...ev.dataTransfer.files].forEach((f) => add(f.name, (f.size / 1048576).toFixed(1) + ' MB')));
  document.getElementById('file').addEventListener('change', (ev) => [...ev.target.files].forEach((f) => add(f.name, (f.size / 1048576).toFixed(1) + ' MB')));
</script>
</body>
</html>
